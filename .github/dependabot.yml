# Automated bump paths for the SHA-pinned actions and the locked Node
# dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One pull request for the whole workflow set: the actions move together and
    # a per-action PR would re-run the full matrix for each.
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      node-development:
        dependency-type: development
      # three and lil-gui are served to the browser through vendor-importmap.js,
      # whose SRI hashes are regenerated by `npm run importmap`; a bump PR stays
      # red until that runs.
      browser-runtime:
        dependency-type: production
