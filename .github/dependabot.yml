# Automated bump paths for the SHA-pinned actions and the locked Node
# dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Browser runtime bumps require `npm run importmap` to refresh SRI hashes.
      three-runtime-and-types:
        patterns:
          - "three"
          - "@types/three"
      browser-runtime:
        dependency-type: production
      node-development:
        dependency-type: development
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: monthly
    groups:
      shellcheck:
        patterns:
          - "shellcheck-py"
