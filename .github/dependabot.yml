# Automated bump paths for the SHA-pinned actions and the locked Node
# dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      node-development:
        dependency-type: development
      # A bump stays red until `npm run importmap` regenerates the SRI hashes in
      # vendor-importmap.js.
      browser-runtime:
        dependency-type: production
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: monthly
    groups:
      shellcheck:
        patterns:
          - "shellcheck-py"
