# Run the simulator's JS unit suite on every pull request. deploy.yml gates the
# same suite on push-to-master (the deploy path); this standalone workflow gives
# PRs a pre-merge signal so a regression across the test files is caught before
# merge rather than only at deploy time. Both call js-unit-suite.yml.
name: JS unit tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: js-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-tests:
    name: Simulator JS unit tests
    permissions:
      contents: read
    uses: ./.github/workflows/js-unit-suite.yml
    secrets:
      POV_TOKEN: ${{ secrets.POV_TOKEN }}
