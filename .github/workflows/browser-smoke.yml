# Reusable real-browser coverage for the deployed surface. One runner performs
# setup once, then reports every probe failure before exiting.
name: Browser suite

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    name: Browser integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Drive every browser probe
        shell: bash
        run: |
          status=0
          for script in \
            scripts/browser-smoke.mjs \
            scripts/workbench-probe.mjs \
            scripts/panel-probe.mjs \
            scripts/solids-probe.mjs
          do
            echo "::group::$script"
            node "$script" || status=1
            echo "::endgroup::"
          done
          exit "$status"
