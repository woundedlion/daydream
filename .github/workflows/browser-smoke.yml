# Loads every page site_manifest.txt publishes in a real browser and requires a
# clean console and a painted frame from each. Runs on pull requests for a
# pre-merge signal, and deploy.yml's `deploy` job needs it, so a page that no
# longer boots blocks the deploy.
#
# The unit suite runs over tests/fake_dom.js, so this is the only job that
# resolves the import map, instantiates the WASM module, drives the render loop
# and enforces the pages' CSP the way a visitor's browser does.
#
# The served set is site_manifest.txt, the same list deploy.yml stages _site
# from: a smoke over the whole repository tree would resolve paths the deployed
# site does not have.
#
# No browser is downloaded. puppeteer-core drives the Chrome the ubuntu-24.04
# image already ships; scripts/browser-smoke.mjs resolves it from $CHROME_PATH
# or the standard install paths and fails when it finds none, so an image that
# drops Chrome reds this job instead of passing over zero pages. The runner has
# no GPU and every page but palettes.html renders through WebGL, so the script
# launches it on SwiftShader (--use-gl=angle --use-angle=swiftshader
# --enable-unsafe-swiftshader) under --no-sandbox.
name: Browser smoke

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: Headless page smoke
    # Explicit label, not ubuntu-latest: the preinstalled Chrome is the browser
    # under test. The label selects an image family, so that Chrome's version
    # still rolls with GitHub's image updates.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Resolve the Node pin
        id: node
        # js-unit-suite.yml holds the one spelling of the Node version, read
        # here rather than copied.
        run: |
          pin="$(sed -n "s/.*node-version: *'\([0-9.]*\)'.*/\1/p" .github/workflows/js-unit-suite.yml | head -n1)"
          if [ -z "$pin" ]; then
            echo "::error::.github/workflows/js-unit-suite.yml no longer spells a node-version pin, so this job has no version to run the app's tooling on."
            exit 1
          fi
          echo "Running on Node $pin (pinned in js-unit-suite.yml)"
          echo "version=$pin" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - run: npm ci

      - name: Smoke the served pages
        run: node scripts/browser-smoke.mjs
