# The two headless-Chrome jobs. The smoke loads every page site_manifest.txt
# publishes and requires a clean console and a painted frame from each; the
# workbench probe drives the shader workbench's pipeline strip with a real mouse
# and requires each pointer gesture to land what it names. Both run on pull
# requests for a pre-merge signal, and deploy.yml's `deploy` job needs this
# workflow, so a page that no longer boots — or a strip whose palettes open off
# their control and whose chips no longer take a click — blocks the deploy.
#
# The unit suite runs over tests/fake_dom.js, which has neither layout nor
# pointer capture, so these are the only jobs that resolve the import map,
# instantiate the WASM module, drive the render loop, enforce the pages' CSP and
# measure where an element actually lands, the way a visitor's browser does.
#
# The served set is site_manifest.txt, the same list deploy.yml stages _site
# from: a smoke over the whole repository tree would resolve paths the deployed
# site does not have.
#
# No browser is downloaded. puppeteer-core drives the Chrome the ubuntu-24.04
# image already ships; scripts/browser.mjs resolves it from $CHROME_PATH or the
# standard install paths and fails when it finds none, so an image that drops
# Chrome reds these jobs instead of passing over zero pages. The runner has no
# GPU and every page but palettes.html renders through WebGL, so the same module
# launches it on SwiftShader (--use-gl=angle --use-angle=swiftshader
# --enable-unsafe-swiftshader) under --no-sandbox.
name: Browser smoke

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: ${{ matrix.name }}
    # Explicit label, not ubuntu-latest: the preinstalled Chrome is the browser
    # under test. The label selects an image family, so that Chrome's version
    # still rolls with GitHub's image updates.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Neither run tells the other anything: a red smoke must not hide which
      # workbench gestures also broke.
      fail-fast: false
      matrix:
        include:
          - name: Headless page smoke
            script: scripts/browser-smoke.mjs
          - name: Workbench pointer gestures
            script: scripts/workbench-probe.mjs
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Resolve the Node pin
        id: node
        # js-unit-suite.yml holds the one spelling of the Node version, read
        # here rather than copied.
        run: |
          pin="$(sed -n "s/.*node-version: *'\([0-9.]*\)'.*/\1/p" .github/workflows/js-unit-suite.yml | head -n1)"
          if [ -z "$pin" ]; then
            echo "::error::.github/workflows/js-unit-suite.yml no longer spells a node-version pin, so this job has no version to run the app's tooling on."
            exit 1
          fi
          echo "Running on Node $pin (pinned in js-unit-suite.yml)"
          echo "version=$pin" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - run: npm ci

      - name: Drive the browser
        run: node ${{ matrix.script }}
