# Reusable real-browser coverage for the deployed surface. One runner performs
# setup once, then reports every probe failure before exiting.
name: Browser suite

on:
  workflow_call:
    inputs:
      daydream-sha:
        type: string
        default: ''
      engine-sha:
        type: string
        default: ''
      engine-bundle:
        description: Install this run's verified engine package before testing.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  browser:
    name: Browser integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.daydream-sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Download the engine package for this deployment
        if: inputs.engine-bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-engine-bundle
          path: engine-bundle
      - name: Install the verified engine package
        if: inputs.engine-bundle
        env:
          SELECTED_PIN: ${{ inputs.engine-sha }}
        run: |
          HOLOSPHERE_BUNDLE_PIN="${SELECTED_PIN:-$(cat engine-bundle/generated/holosphere_wasm.sha)}" node scripts/install-engine-bundle.mjs engine-bundle
          echo "ENGINE_BUNDLE_DIR=$GITHUB_WORKSPACE/engine-bundle" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Install the browser pinned by Puppeteer
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { install, Browser } from '@puppeteer/browsers';
          import { PUPPETEER_REVISIONS } from 'puppeteer-core';
          const browser = await install({
            browser: Browser.CHROME,
            buildId: PUPPETEER_REVISIONS.chrome,
            cacheDir: `${process.env.RUNNER_TEMP}/puppeteer`,
          });
          appendFileSync(process.env.GITHUB_ENV, `CHROME_PATH=${browser.executablePath}\n`);
          NODE
      - name: Drive every browser probe
        shell: bash
        env:
          # Ceiling for one script, and for the loop as a whole. The budget sits
          # inside timeout-minutes so a hang is reported here, against the script
          # that hung, rather than killed by the runner with the rest unrun.
          PROBE_TIMEOUT_S: '420'
          PROBE_BUDGET_S: '1500'
        run: |
          status=0
          deadline=$(( $(date +%s) + PROBE_BUDGET_S ))
          for script in \
            scripts/browser-smoke.mjs \
            scripts/workbench-probe.mjs \
            scripts/panel-probe.mjs \
            scripts/solids-probe.mjs \
            scripts/palettes-probe.mjs \
            scripts/mobius-probe.mjs \
            scripts/lissajous-probe.mjs
          do
            echo "::group::$script"
            left=$(( deadline - $(date +%s) ))
            limit=$(( left < PROBE_TIMEOUT_S ? left : PROBE_TIMEOUT_S ))
            if [ "$limit" -le 0 ]; then
              echo "::error::$script never ran: the ${PROBE_BUDGET_S}s probe budget is spent"
              status=1
            else
              timeout -k 10s "${limit}s" node "$script" && code=0 || code=$?
              if [ "$code" -ne 0 ]; then
                status=1
                if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
                  echo "::error::$script was killed after ${limit}s without finishing"
                fi
              fi
            fi
            echo "::endgroup::"
          done
          exit "$status"
