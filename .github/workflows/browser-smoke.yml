# Reusable real-browser coverage for the deployed surface. One runner performs
# setup once, then reports every probe failure before exiting.
name: Browser suite

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    name: Browser integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Drive every browser probe
        shell: bash
        env:
          # Ceiling for one script, and for the loop as a whole. The budget sits
          # inside timeout-minutes so a hang is reported here, against the script
          # that hung, rather than killed by the runner with the rest unrun.
          PROBE_TIMEOUT_S: '420'
          PROBE_BUDGET_S: '1500'
        run: |
          status=0
          deadline=$(( $(date +%s) + PROBE_BUDGET_S ))
          for script in \
            scripts/browser-smoke.mjs \
            scripts/workbench-probe.mjs \
            scripts/panel-probe.mjs \
            scripts/solids-probe.mjs \
            scripts/palettes-probe.mjs \
            scripts/mobius-probe.mjs \
            scripts/lissajous-probe.mjs
          do
            echo "::group::$script"
            left=$(( deadline - $(date +%s) ))
            limit=$(( left < PROBE_TIMEOUT_S ? left : PROBE_TIMEOUT_S ))
            if [ "$limit" -le 0 ]; then
              echo "::error::$script never ran: the ${PROBE_BUDGET_S}s probe budget is spent"
              status=1
            else
              timeout -k 10s "${limit}s" node "$script" && code=0 || code=$?
              if [ "$code" -ne 0 ]; then
                status=1
                if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
                  echo "::error::$script was killed after ${limit}s without finishing"
                fi
              fi
            fi
            echo "::endgroup::"
          done
          exit "$status"
