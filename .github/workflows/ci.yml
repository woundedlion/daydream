name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-tests:
    name: Static and unit tests
    uses: ./.github/workflows/js-unit-suite.yml
    secrets:
      POV_TOKEN: ${{ secrets.POV_TOKEN }}

  browser:
    name: Browser tests
    uses: ./.github/workflows/browser-smoke.yml

  ci-green:
    name: CI green
    needs:
      - js-tests
      - browser
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
      - name: Require every suite
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/verify-ci-green.mjs
