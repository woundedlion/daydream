name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Verified engine bundle
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/engine-bundle.yml
    secrets:
      POV_TOKEN: ${{ secrets.POV_TOKEN }}

  js-tests:
    needs: gate
    name: Static and unit tests
    uses: ./.github/workflows/js-unit-suite.yml
    with:
      engine-sha: ${{ needs.gate.outputs.pin }}
    secrets:
      POV_TOKEN: ${{ secrets.POV_TOKEN }}

  browser:
    needs: gate
    name: Browser tests
    uses: ./.github/workflows/browser-smoke.yml
    with:
      engine-sha: ${{ needs.gate.outputs.pin }}

  ci-green:
    name: CI green
    needs:
      - gate
      - js-tests
      - browser
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - name: Require every suite
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/verify-ci-green.mjs
