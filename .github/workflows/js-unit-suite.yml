name: JS unit suite

on:
  workflow_call:
    secrets:
      POV_TOKEN:
        description: Read access to woundedlion/pov while it is private.
        required: false

permissions:
  contents: read

jobs:
  js-tests:
    name: JavaScript, types, shell and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve engine pin
        id: engine
        run: |
          pin="$(tr -d '[:space:]' < holosphere_wasm.sha)"
          if ! printf '%s' "$pin" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::holosphere_wasm.sha must contain one full engine commit"
            exit 1
          fi
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      # The mirrored shader modules are compared byte for byte, so the engine
      # checkout tracks the committed pin: engine tip moves independently and
      # would make a re-run of an unchanged commit flip verdicts.
      - name: Checkout the pinned engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: woundedlion/pov
          ref: ${{ steps.engine.outputs.pin }}
          token: ${{ secrets.POV_TOKEN || github.token }}
          path: engine
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Lint JavaScript
        run: npm run lint
      - run: npm run typecheck
      - name: Verify committed import map
        run: |
          npm run importmap
          git diff --exit-code
      - name: Verify CDN integrity
        run: node scripts/check-cdn-integrity.mjs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install shellcheck
        run: pip install --require-hashes -r requirements/shellcheck.txt
      - name: Lint shell
        run: |
          mapfile -t FILES < <(git ls-files -- '*.sh' '.githooks/*')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no shell files selected"
            exit 1
          fi
          shellcheck --exclude=SC2015,SC2317 "${FILES[@]}"
      # actionlint-py is the PyPI distribution of the same binary, pinned like
      # shellcheck above.
      - name: Install actionlint
        run: pip install --require-hashes -r requirements/actionlint.txt
      # The deploy gate, the engine-bundle wait and the probe budget are shell
      # inside `run:` blocks, which the step above cannot reach: no workflow is
      # a tracked *.sh file. actionlint checks the workflow itself (expression
      # syntax, the `needs` graph, event and matrix keys) and pipes every
      # `run:` body through shellcheck. The file list comes from the index, so a
      # new workflow is linted with no edit here and an empty list is a broken
      # path list.
      # actionlint drops its shellcheck integration silently when the binary is
      # not on PATH, which would leave every run body unchecked behind a green
      # step; -verbose reports the drop, so it is captured and made fatal.
      - name: Lint workflows
        run: |
          mapfile -t FILES < <(git ls-files -- '.github/workflows/*.yml')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no workflow files selected"
            exit 1
          fi
          actionlint -verbose -oneline "${FILES[@]}" 2> /tmp/actionlint-verbose.txt
          if grep -q 'Rule "shellcheck" was disabled' /tmp/actionlint-verbose.txt; then
            echo "::error::actionlint ran without shellcheck — the run: bodies went unchecked"
            exit 1
          fi
          echo "actionlint clean: ${#FILES[@]} workflows linted."
      - name: Test
        env:
          DAYDREAM_HOOK_SH_REQUIRED: '1'
          HOLOSPHERE_ENGINE_REQUIRED: '1'
        run: npm test
