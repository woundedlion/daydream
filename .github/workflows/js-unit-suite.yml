name: JS unit suite

on:
  workflow_call:

permissions:
  contents: read

jobs:
  js-tests:
    name: JavaScript, types, shell and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Lint JavaScript
        run: npm run lint
      - run: npm run typecheck
      - name: Verify committed import map
        run: |
          npm run importmap
          git diff --exit-code
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install shellcheck
        run: pip install 'shellcheck-py==0.11.0.1'
      - name: Lint shell
        run: |
          mapfile -t FILES < <(git ls-files -- '*.sh' '.githooks/*')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no shell files selected"
            exit 1
          fi
          shellcheck --exclude=SC2015,SC2317 "${FILES[@]}"
      - name: Test
        env:
          DAYDREAM_WASM_CLEAN_REQUIRED: '1'
          DAYDREAM_HOOK_SH_REQUIRED: '1'
        run: npm test
