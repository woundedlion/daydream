# The simulator's JS unit suite: install, typecheck, import-map freshness, unit
# tests. Called by js-tests.yml (pull requests) and by deploy.yml's gate
# (push to master), so both paths run one definition rather than two copies
# that drift apart.
name: JS unit suite

on:
  workflow_call:

permissions:
  contents: read

jobs:
  js-tests:
    name: npm test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'      # package.json engines: node >=22.3.0
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - name: Verify committed import map
        run: |
          npm run importmap
          git diff --exit-code
      - run: npm test
