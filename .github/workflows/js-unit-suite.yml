name: JS unit suite

on:
  workflow_call:
    inputs:
      daydream-sha:
        type: string
        default: ''
      engine-sha:
        type: string
        default: ''
    secrets:
      POV_TOKEN:
        description: Optional read access for a future private engine repository; the public repository uses the run token.
        required: false

permissions:
  contents: read

jobs:
  js-tests:
    name: JavaScript, types, shell and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.daydream-sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
          cache: npm
      - name: Download the engine package for this deployment
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-engine-bundle
          path: engine-bundle
      - name: Install the verified engine package
        env:
          SELECTED_PIN: ${{ inputs.engine-sha }}
        run: |
          test -n "$SELECTED_PIN" || { echo "::error::Selected engine pin is empty"; exit 1; }
          HOLOSPHERE_BUNDLE_PIN="$SELECTED_PIN" node scripts/install-engine-bundle.mjs engine-bundle
          echo "ENGINE_BUNDLE_DIR=$GITHUB_WORKSPACE/engine-bundle" >> "$GITHUB_ENV"
      - name: Resolve engine pin
        id: engine
        run: |
          pin="$(tr -d '[:space:]' < generated/holosphere_wasm.sha)"
          if ! printf '%s' "$pin" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::holosphere_wasm.sha must contain one full engine commit"
            exit 1
          fi
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Checkout the pinned engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: woundedlion/pov
          ref: ${{ steps.engine.outputs.pin }}
          token: ${{ secrets.POV_TOKEN || github.token }}
          path: engine
          fetch-depth: 1
          persist-credentials: false
      - run: npm ci
      - name: Lint JavaScript
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Verify committed import map
        run: |
          npm run importmap
          git diff --exit-code -- vendor-importmap.js
      - name: Verify generated Tailwind styles
        run: |
          npm run generate:tailwind
          git diff --exit-code -- tools/tailwind.css
      - name: Verify CDN integrity
        run: node scripts/check-cdn-integrity.mjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install shellcheck
        run: pip install --require-hashes -r requirements/shellcheck.txt
      - name: Lint shell
        run: |
          mapfile -t FILES < <(git ls-files -- '*.sh' '.githooks/*')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no shell files selected"
            exit 1
          fi
          shellcheck "${FILES[@]}"
      - name: Install actionlint
        run: |
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Lint workflows
        run: |
          mapfile -t FILES < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no workflow files selected"
            exit 1
          fi
          actionlint -verbose -oneline "${FILES[@]}" 2> /tmp/actionlint-verbose.txt
          test -s /tmp/actionlint-verbose.txt
          if grep -q 'Rule "shellcheck" was disabled' /tmp/actionlint-verbose.txt; then
            echo "::error::actionlint ran without shellcheck — the run: bodies went unchecked"
            exit 1
          fi
          echo "actionlint clean: ${#FILES[@]} workflows linted."
      - name: Test
        env:
          DAYDREAM_HOOK_SH_REQUIRED: '1'
          HOLOSPHERE_ENGINE_REQUIRED: '1'
        run: npm test
