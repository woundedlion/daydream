# The simulator's JS unit suite: install, lint, typecheck, import-map freshness,
# unit tests. Called by js-tests.yml (pull requests) and by deploy.yml's gate
# (push to master), so both paths run one definition rather than two copies
# that drift apart.
#
# tests/engine_source_parity.test.js reads the engine headers the browser tools
# hand-transcribe, so the job checks the engine out to engine/ and declares it
# required, which turns a missing checkout from a skipped case into a failure.
#
# That checkout tracks the engine's default branch, not the holosphere_wasm.sha
# pin deploy.yml's gate uses. The transcriptions have to agree with engine HEAD
# before the next WASM rebuild advances the pin; at the pin they agree by
# construction, which is what tests/color_parity_wasm.test.js already covers.
name: JS unit suite

on:
  workflow_call:
    secrets:
      POV_TOKEN:
        description: Read access to woundedlion/pov; needed only while it is private.
        required: false

permissions:
  contents: read

jobs:
  js-tests:
    name: npm test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0   # full history: tests/wasm_provenance.test.js reads git log per file

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2' # tests/assertion-floors.json measurement runtime
          cache: npm

      - run: npm ci

      # Config in eslint.config.mjs. An over-broad `ignores` list would empty the
      # target set while `eslint .` still exits 0, so count the files the run
      # actually reported on. The second invocation is the one whose output a
      # failure is read from.
      - name: Lint JavaScript
        run: |
          npx eslint . --format json > /tmp/eslint-report.json || true
          count=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/eslint-report.json','utf8')).length")
          if [ "$count" -eq 0 ]; then
            echo "::error::no files selected — the eslint.config.mjs ignores list is broken"
            exit 1
          fi
          npx eslint .
          echo "eslint clean: $count files linted."

      - run: npm run typecheck
      - name: Verify committed import map
        run: |
          npm run importmap
          git diff --exit-code

      - name: Checkout engine (woundedlion/pov)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: woundedlion/pov
          token: ${{ secrets.POV_TOKEN || github.token }}
          path: engine

      - name: Test
        env:
          HOLOSPHERE_ENGINE_REQUIRED: '1'
        run: npm test
