name: JS unit suite

on:
  workflow_call:
    secrets:
      POV_TOKEN:
        description: Read access to woundedlion/pov while it is private.
        required: false

permissions:
  contents: read

jobs:
  js-tests:
    name: JavaScript, types, shell and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve engine pin
        id: engine
        run: |
          pin="$(tr -d '[:space:]' < holosphere_wasm.sha)"
          if ! printf '%s' "$pin" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::holosphere_wasm.sha must contain one full engine commit"
            exit 1
          fi
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      # The mirrored shader modules are compared byte for byte, so the engine
      # checkout tracks the committed pin: engine tip moves independently and
      # would make a re-run of an unchanged commit flip verdicts.
      - name: Checkout the pinned engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: woundedlion/pov
          ref: ${{ steps.engine.outputs.pin }}
          token: ${{ secrets.POV_TOKEN || github.token }}
          path: engine
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Lint JavaScript
        run: npm run lint
      - run: npm run typecheck
      - name: Verify committed import map
        run: |
          npm run importmap
          git diff --exit-code
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install shellcheck
        run: pip install 'shellcheck-py==0.11.0.1'
      - name: Lint shell
        run: |
          mapfile -t FILES < <(git ls-files -- '*.sh' '.githooks/*')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no shell files selected"
            exit 1
          fi
          shellcheck --exclude=SC2015,SC2317 "${FILES[@]}"
      - name: Test
        env:
          DAYDREAM_HOOK_SH_REQUIRED: '1'
          HOLOSPHERE_ENGINE_REQUIRED: '1'
        run: npm test
