# Deploy the daydream simulator to GitHub Pages (Pages source: GitHub Actions),
# GATED on the Holosphere engine's native unit suite and the simulator's JS unit
# suite. The `deploy` job `needs: [gate, js-tests]`, so the live site only updates
# when both suites pass.
#
# The committed app files are published as-is (three.js / lil-gui load from the
# CDN via vendor-importmap.js, so they don't need vendoring here). The engine's
# WASM module is whatever is committed in this repo — built and installed from
# Holosphere; the gate verifies that engine's suite is green.
#
# The gate pins its engine checkout to the SHA the committed .wasm was built
# from (holosphere_wasm.sha, written next to the module by the Holosphere WASM
# install step), so it tests the exact source the deployed module corresponds to
# rather than a decoupled engine HEAD. It also asserts the committed .wasm is
# byte-identical to the hash recorded at build time (holosphere_wasm.wasm.sha256),
# binding the deployed artifact to that recorded hash. That manifest carries an
# entry for the .js Emscripten glue as well, so the glue is bound to the binary
# by content. Finally it asserts .wasm, .wasm.sha256 and .sha share a last-touch
# commit — the install rewrites all three on every build, so a lone-file commit
# means the engine source-pin has decoupled from the binary. If any file is
# missing, a hash does not match, or the three were not committed together, the
# gate fails hard rather than deploying an unverifiable artifact (a silent
# fallback to engine HEAD would make the gate inert).
#
# The glue is deliberately NOT in the atomicity set: it is byte-identical across
# most engine builds, so git has nothing to commit for it and its last-touch
# commit legitimately trails the binary's. Its hash entry is the binding.
#
# The same install drops the engine's segment-map golden (pov_segment_map.json)
# here. The gate diffs the committed copy against the pinned engine checkout, so
# the segment cross-check in the JS suite cannot measure the web tiling against a
# firmware table that has drifted from the engine's header.
#
# If the engine repo (woundedlion/pov) is PRIVATE, add a repository secret
# POV_TOKEN = a PAT with read access. For a public engine repo the default
# workflow token is sufficient.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Default every job to source read-only. Deploy grants its publish capabilities.
permissions:
  contents: read

# One deploy at a time; let an in-progress deploy finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    name: Engine unit tests (deploy gate)
    # Checks out and runs a second repository's build; never holds the Pages token.
    permissions:
      contents: read
    runs-on: ubuntu-24.04   # pinned image: deterministic apt clang version
    steps:
      - name: Checkout daydream (for the pinned engine SHA)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0   # full history: the provenance-atomicity check reads git log per file

      - name: Verify committed WASM matches its recorded build hash
        run: |
          if [ ! -f holosphere_wasm.wasm.sha256 ]; then
            echo "::error::holosphere_wasm.wasm.sha256 not found — the deployed artifact is unverifiable. The Holosphere WASM install writes it next to the module; commit it with the .wasm."
            exit 1
          fi
          sha256sum -c holosphere_wasm.wasm.sha256

      - name: Verify the installed WASM files were committed atomically
        # The Holosphere WASM install rewrites .wasm, .wasm.sha256 and .sha on
        # every build, so they must be committed together. The sha256 check above
        # binds .wasm↔.wasm.sha256 and .js↔.wasm.sha256 (content), but cannot
        # catch a .sha advanced to a different engine commit while the binary is
        # stale. Asserting a shared last-touch commit closes that gap.
        run: |
          wasm_c="$(git log -1 --format=%H -- holosphere_wasm.wasm)"
          sha_c="$(git log -1 --format=%H -- holosphere_wasm.sha)"
          s256_c="$(git log -1 --format=%H -- holosphere_wasm.wasm.sha256)"
          echo "last-touch commits: .wasm=$wasm_c .sha=$sha_c .wasm.sha256=$s256_c"
          if [ -z "$wasm_c" ] || [ "$wasm_c" != "$sha_c" ] || [ "$wasm_c" != "$s256_c" ]; then
            echo "::error::WASM install files were not committed atomically — the engine source-pin (.sha) and/or the recorded hash (.wasm.sha256) are decoupled from the binary (.wasm). Re-run the Holosphere WASM install and commit them together."
            exit 1
          fi

      - name: Resolve engine SHA the committed WASM was built from
        id: engine
        run: |
          if [ ! -f holosphere_wasm.sha ]; then
            echo "::error::holosphere_wasm.sha not found — engine provenance is unrecorded, so the gate can't pin to the source the committed WASM was built from. The Holosphere WASM install writes it next to the module; commit it with the .wasm."
            exit 1
          fi
          sha="$(tr -d '[:space:]' < holosphere_wasm.sha)"
          # A ref actions/checkout can't resolve (a `-dirty` marker, an
          # abbreviated SHA, a branch name) surfaces only as an opaque
          # "ref not found" several steps later.
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::holosphere_wasm.sha does not hold a bare 40-hex engine SHA (got '$sha') — rebuild from a clean Holosphere checkout and re-commit all four installed WASM files."
            exit 1
          fi
          echo "Pinning engine checkout to $sha (from holosphere_wasm.sha)"
          echo "ref=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout engine (woundedlion/pov) at the pinned SHA
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: woundedlion/pov
          ref: ${{ steps.engine.outputs.ref }}
          token: ${{ secrets.POV_TOKEN || github.token }}
          path: engine

      - name: Verify the committed segment-map golden matches the pinned engine
        # pov_segment_map.json is the firmware segment→canvas table
        # tests/segment_crosscheck.test.js measures the web tiling against. The
        # engine emits it from hardware/pov_segment_map.h and its
        # unit_pov_segment_map_golden CTest (run below) pins it to that header, so
        # requiring this copy to equal the engine's at the pinned SHA is what keeps
        # a segment convention change from riding green here on a stale table.
        run: |
          if [ ! -f pov_segment_map.json ]; then
            echo "::error::pov_segment_map.json not found — the segment cross-check has no firmware reference. The Holosphere WASM install writes it next to the module; commit it with the .wasm."
            exit 1
          fi
          if ! diff -u engine/hardware/pov_segment_map.json pov_segment_map.json; then
            echo "::error::pov_segment_map.json is stale relative to the pinned engine ($(cat holosphere_wasm.sha)) — re-run the Holosphere WASM install and commit the refreshed golden."
            exit 1
          fi

      - name: Install Clang + Ninja
        # Pin the compiler version (clang-18 = Ubuntu 24.04 default) to match CI
        # so the deploy gate runs the engine suite on the same known compiler.
        run: sudo apt-get update && sudo apt-get install -y clang-18 ninja-build

      - run: >
          cmake --preset tests -DHS_INSTALL_GIT_HOOKS=OFF
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
        working-directory: engine
      - run: cmake --build --preset tests
        working-directory: engine
      - name: Test
        # Same tier as the engine's own presubmit (Holosphere .github/workflows/ci.yml).
        # The defaults are the QUICK tier: an 8-frame smoke at device resolution
        # only, which never reaches the effect-lifecycle transitions nor the
        # 288x144 production-resolution roster passes.
        env:
          HS_SMOKE_FRAMES: 120
          HS_EFFECTS_FULL: 1
        run: ctest --preset tests --output-on-failure
        working-directory: engine

  js-tests:
    name: Simulator JS unit tests (deploy gate)
    permissions:
      contents: read
    uses: ./.github/workflows/js-unit-suite.yml

  deploy:
    name: Deploy to Pages
    needs: [gate, js-tests]       # ← only deploys if both suites pass
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Stage site (explicit allowlist)
        # Publish only the runtime app, not the whole repo tree. The former
        # path: '.' shipped .git/, tests/, scripts/, and dev tooling to Pages
        # (node_modules/, three.js/, vendor/ are gitignored, so absent from this
        # fresh checkout — but the tracked dev files were not). Copy the served
        # set: index.html, README + its screenshot gallery, the root ES modules,
        # styles/, tools/, and the WASM binary. three.js / lil-gui / Tailwind
        # load from their CDNs (vendor-importmap.js + the tools' onerror
        # fallback), so no vendored dirs are needed.
        run: |
          mkdir _site
          cp index.html README.md *.js holosphere_wasm.wasm _site/
          cp -r styles tools docs _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '_site'

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
