name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: Republish an unchanged pair
        type: boolean
        default: false
  repository_dispatch:
    types: [holosphere-engine-ready]
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve deployment pair
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    outputs:
      daydream: ${{ steps.pair.outputs.daydream }}
      holosphere: ${{ steps.pair.outputs.holosphere }}
      deploy: ${{ steps.pair.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - id: pair
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_DEPLOY: ${{ inputs.force }}
        run: node scripts/deployment-pair.mjs resolve
      - name: Record deployment attempt
        if: steps.pair.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deployment-pair.mjs attempt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-pair
          path: deployment-pair.json
          retention-days: 1
  gate:
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    name: Verified engine bundle
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/engine-bundle.yml
    with:
      daydream-sha: ${{ needs.resolve.outputs.daydream }}
      engine-sha: ${{ needs.resolve.outputs.holosphere }}
    secrets:
      POV_TOKEN: ${{ secrets.POV_TOKEN }}

  js-tests:
    needs: [resolve, gate]
    name: Simulator JS unit tests (deploy gate)
    permissions:
      contents: read
    uses: ./.github/workflows/js-unit-suite.yml
    with:
      daydream-sha: ${{ needs.resolve.outputs.daydream }}
      engine-sha: ${{ needs.resolve.outputs.holosphere }}
    secrets:
      POV_TOKEN: ${{ secrets.POV_TOKEN }}

  browser-smoke:
    needs: [resolve, gate]
    name: Headless page smoke (deploy gate)
    permissions:
      contents: read
    uses: ./.github/workflows/browser-smoke.yml
    with:
      daydream-sha: ${{ needs.resolve.outputs.daydream }}
      engine-sha: ${{ needs.resolve.outputs.holosphere }}

  deploy:
    name: Deploy to Pages
    needs: [resolve, gate, js-tests, browser-smoke]
    permissions:
      contents: read
      deployments: write
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # The engine pair the browser instantiates, staged and then served. Both
      # steps below read this list, so neither can check a different set.
      ENGINE_ASSETS: generated/holosphere_wasm.wasm generated/holosphere_wasm.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.daydream }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - name: Download the engine package for this deployment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-engine-bundle
          path: engine-bundle
      - name: Install the verified engine package
        env:
          HOLOSPHERE_BUNDLE_PIN: ${{ needs.resolve.outputs.holosphere }}
        run: node scripts/install-engine-bundle.mjs engine-bundle
      - name: Download deployment pair
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deployment-pair
          path: .
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Stage site from site_manifest.txt and verified engine assets
        run: node scripts/stage-site.mjs engine-bundle _site deployment-pair.json
      # Pages derives a Content-Type from the served path, so an asset missing
      # from the staged tree is served as a 404 page under the engine's name.
      # That is the half of the check below that can be made before publishing,
      # and it runs here rather than against the live site.
      - name: Verify the staged engine assets
        run: |
          status=0
          for asset in $ENGINE_ASSETS; do
            case "$asset" in
              *.wasm|*.js) ;;
              *) echo "::error::$asset has no Content-Type this workflow knows"; status=1 ;;
            esac
            if [ ! -s "_site/$asset" ]; then
              echo "::error::_site/$asset is missing or empty; Pages would serve a 404 for it"
              status=1
            fi
          done
          exit $status
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Require current master heads
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deployment-pair.mjs check
      - id: deployment
        if: steps.current.outputs.current == 'true'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      # A served Content-Type exists only once the site is published, so this
      # confirms what the step above could only predict.
      - name: Verify published engine MIME types
        if: steps.current.outputs.current == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for asset in $ENGINE_ASSETS; do
            mime="$(curl --fail --silent --show-error --location --retry 5 --retry-all-errors --output /dev/null --write-out '%{content_type}' "${PAGE_URL%/}/$asset")"
            case "$asset:$mime" in
              *.wasm:application/wasm*|*.js:text/javascript*|*.js:application/javascript*) ;;
              *) echo "::error::$asset has unexpected Content-Type: $mime"; exit 1 ;;
            esac
          done
      - name: Record successful deployment pair
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deployment-pair.mjs record
