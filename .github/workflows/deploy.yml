name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: Republish an unchanged pair
        type: boolean
        default: false
  repository_dispatch:
    types: [holosphere-engine-ready]
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve deployment pair
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
      actions: read
    outputs:
      daydream: ${{ steps.pair.outputs.daydream }}
      holosphere: ${{ steps.pair.outputs.holosphere }}
      deploy: ${{ steps.pair.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - id: pair
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_DEPLOY: ${{ inputs.force }}
        run: node scripts/deployment-pair.mjs resolve
      - name: Record deployment attempt
        if: steps.pair.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deployment-pair.mjs attempt
  gate:
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    name: Verified engine bundle
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/engine-bundle.yml
    with:
      daydream-sha: ${{ needs.resolve.outputs.daydream }}
      engine-sha: ${{ needs.resolve.outputs.holosphere }}
    secrets:
      POV_TOKEN: ${{ secrets.POV_TOKEN }}

  js-tests:
    needs: [resolve, gate]
    name: Simulator JS unit tests (deploy gate)
    permissions:
      contents: read
    uses: ./.github/workflows/js-unit-suite.yml
    with:
      daydream-sha: ${{ needs.resolve.outputs.daydream }}
      engine-sha: ${{ needs.resolve.outputs.holosphere }}
    secrets:
      POV_TOKEN: ${{ secrets.POV_TOKEN }}

  browser-smoke:
    needs: [resolve, gate]
    name: Headless page smoke (deploy gate)
    permissions:
      contents: read
    uses: ./.github/workflows/browser-smoke.yml
    with:
      daydream-sha: ${{ needs.resolve.outputs.daydream }}
      engine-sha: ${{ needs.resolve.outputs.holosphere }}

  deploy:
    name: Deploy to Pages
    needs: [resolve, gate, js-tests, browser-smoke]
    concurrency:
      group: pages-publication
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Engine assets the browser instantiates, verified staged and served.
      ENGINE_ASSETS: generated/holosphere_wasm.wasm generated/holosphere_wasm.js generated/segment_geometry.js generated/engine_contract.mjs generated/shader/shader_workbench.mjs generated/shader/sha256.mjs generated/shader/composed_effect_roster.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.daydream }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - name: Download the engine package for this deployment
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-engine-bundle
          path: engine-bundle
      - name: Install the verified engine package
        env:
          HOLOSPHERE_BUNDLE_PIN: ${{ needs.resolve.outputs.holosphere }}
        run: node scripts/install-engine-bundle.mjs engine-bundle
      - name: Restore deployment pair from resolved outputs
        env:
          DAYDREAM_SHA: ${{ needs.resolve.outputs.daydream }}
          HOLOSPHERE_SHA: ${{ needs.resolve.outputs.holosphere }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { validatePair } from './scripts/deployment-pair.mjs';
          const pair = validatePair({ daydream: process.env.DAYDREAM_SHA, holosphere: process.env.HOLOSPHERE_SHA });
          writeFileSync('deployment-pair.json', JSON.stringify(pair, null, 2) + '\n');
          NODE
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Stage site from site_manifest.txt and verified engine assets
        run: node scripts/stage-site.mjs engine-bundle _site deployment-pair.json
      - name: Verify the staged engine assets
        run: |
          status=0
          for asset in $ENGINE_ASSETS; do
            case "$asset" in
              *.wasm|*.js|*.mjs) ;;
              *) echo "::error::$asset has no Content-Type this workflow knows"; status=1 ;;
            esac
            if [ ! -s "_site/$asset" ]; then
              echo "::error::_site/$asset is missing or empty; Pages would serve a 404 for it"
              status=1
            fi
          done
          exit $status
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Require current master heads
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deployment-pair.mjs check
      - id: deployment
        if: steps.current.outputs.current == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify published engine MIME types
        if: steps.current.outputs.current == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for asset in $ENGINE_ASSETS; do
            mime="$(curl --fail --silent --show-error --location --retry 5 --retry-all-errors --output /dev/null --write-out '%{content_type}' "${PAGE_URL%/}/$asset")"
            case "$asset:$mime" in
              *.wasm:application/wasm*|*.js:text/javascript*|*.js:application/javascript*|*.mjs:text/javascript*|*.mjs:application/javascript*) ;;
              *) echo "::error::$asset has unexpected Content-Type: $mime"; exit 1 ;;
            esac
          done
      - name: Record successful deployment pair
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deployment-pair.mjs record
