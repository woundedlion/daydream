name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    name: Verified engine bundle
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/engine-bundle.yml
    secrets:
      POV_TOKEN: ${{ secrets.POV_TOKEN }}

  js-tests:
    needs: gate
    name: Simulator JS unit tests (deploy gate)
    permissions:
      contents: read
    uses: ./.github/workflows/js-unit-suite.yml
    with:
      engine-bundle: true
    secrets:
      POV_TOKEN: ${{ secrets.POV_TOKEN }}

  browser-smoke:
    needs: gate
    name: Headless page smoke (deploy gate)
    permissions:
      contents: read
    uses: ./.github/workflows/browser-smoke.yml
    with:
      engine-bundle: true

  deploy:
    name: Deploy to Pages
    needs: [gate, js-tests, browser-smoke]
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # The engine pair the browser instantiates, staged and then served. Both
      # steps below read this list, so neither can check a different set.
      ENGINE_ASSETS: holosphere_wasm.wasm holosphere_wasm.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - name: Download the engine package for this deployment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-engine-bundle
          path: engine-bundle
      - name: Install the verified engine package
        run: |
          HOLOSPHERE_BUNDLE_PIN="$(cat holosphere_wasm.sha)" node scripts/install-engine-bundle.mjs engine-bundle
          git diff --exit-code
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Stage site from the committed manifest
        run: |
          mkdir _site
          status=0
          while read -r path || [ -n "$path" ]; do
            case "$path" in ''|'#'*) continue ;; esac
            if [ ! -f "$path" ] || [ -L "$path" ] || ! git ls-files --error-unmatch -- "$path" > /dev/null 2>&1; then
              echo "::error::site_manifest.txt must list tracked regular files: $path"
              status=1
              continue
            fi
            mkdir -p "_site/$(dirname "$path")"
            cp "$path" "_site/$(dirname "$path")/"
          done < site_manifest.txt
          exit $status
      # Pages derives a Content-Type from the served path, so an asset missing
      # from the staged tree is served as a 404 page under the engine's name.
      # That is the half of the check below that can be made before publishing,
      # and it runs here rather than against the live site.
      - name: Verify the staged engine assets
        run: |
          status=0
          for asset in $ENGINE_ASSETS; do
            case "$asset" in
              *.wasm|*.js) ;;
              *) echo "::error::$asset has no Content-Type this workflow knows"; status=1 ;;
            esac
            if [ ! -s "_site/$asset" ]; then
              echo "::error::_site/$asset is missing or empty; Pages would serve a 404 for it"
              status=1
            fi
          done
          exit $status
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      # A served Content-Type exists only once the site is published, so this
      # confirms what the step above could only predict.
      - name: Verify published engine MIME types
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for asset in $ENGINE_ASSETS; do
            mime="$(curl --fail --silent --show-error --location --retry 5 --retry-all-errors --output /dev/null --write-out '%{content_type}' "${PAGE_URL%/}/$asset")"
            case "$asset:$mime" in
              *.wasm:application/wasm*|*.js:text/javascript*|*.js:application/javascript*) ;;
              *) echo "::error::$asset has unexpected Content-Type: $mime"; exit 1 ;;
            esac
          done
