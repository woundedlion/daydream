name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    name: Verified engine bundle (deploy gate)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Resolve engine pin
        id: engine
        run: |
          pin="$(tr -d '[:space:]' < holosphere_wasm.sha)"
          if ! printf '%s' "$pin" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::holosphere_wasm.sha must contain one full engine commit"
            exit 1
          fi
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Download the verified engine bundle
        env:
          # The engine repository is public, so the run token is sufficient.
          # POV_TOKEN remains available for a future private-repo migration.
          GH_TOKEN: ${{ secrets.POV_TOKEN || github.token }}
          PIN: ${{ steps.engine.outputs.pin }}
        run: |
          deadline=$((SECONDS + 1800))
          while :; do
            read -r run_id run_status run_conclusion < <(
              gh api "repos/woundedlion/pov/actions/workflows/ci.yml/runs?head_sha=$PIN&branch=master&event=push&per_page=1" \
                --jq '.workflow_runs[0] // empty | [.id, .status, (.conclusion // "-")] | @tsv'
            ) || true
            if [ -n "$run_id" ]; then
              if [ "$run_status" = completed ]; then
                if [ "$run_conclusion" != success ]; then
                  echo "::error::POV CI for $PIN concluded $run_conclusion"
                  exit 1
                fi
                artifact_id="$(gh api "repos/woundedlion/pov/actions/runs/$run_id/artifacts" --jq ".artifacts[] | select(.name == \"holosphere-engine-$PIN\") | .id" | head -n1)"
                if [ -z "$artifact_id" ]; then
                  echo "::error::successful POV CI for $PIN published no verified engine bundle"
                  exit 1
                fi
                mkdir engine-bundle
                gh api "repos/woundedlion/pov/actions/artifacts/$artifact_id/zip" > /tmp/engine-bundle.zip
                unzip -q /tmp/engine-bundle.zip -d engine-bundle
                break
              fi
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::no verified engine bundle became available for $PIN"
              exit 1
            fi
            echo "Waiting for the engine bundle at $PIN."
            sleep 15
          done
      - name: Verify the committed engine package
        run: |
          (cd engine-bundle && sha256sum -c holosphere_engine.sha256)
          status=0
          while read -r _ path; do
            path="${path#\*}"
            path="${path#./}"
            if [ ! -f "$path" ]; then
              echo "::error::$path is missing from the committed engine package"
              status=1
            elif ! cmp -s "engine-bundle/$path" "$path"; then
              echo "::error::$path differs from the verified bundle for $(cat holosphere_wasm.sha)"
              status=1
            fi
          done < engine-bundle/holosphere_engine.sha256
          exit $status

  js-tests:
    name: Simulator JS unit tests (deploy gate)
    permissions:
      contents: read
    uses: ./.github/workflows/js-unit-suite.yml
    secrets:
      POV_TOKEN: ${{ secrets.POV_TOKEN }}

  browser-smoke:
    name: Headless page smoke (deploy gate)
    permissions:
      contents: read
    uses: ./.github/workflows/browser-smoke.yml

  deploy:
    name: Deploy to Pages
    needs: [gate, js-tests, browser-smoke]
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Stage site from the committed manifest
        run: |
          mkdir _site
          status=0
          while read -r path || [ -n "$path" ]; do
            case "$path" in ''|'#'*) continue ;; esac
            if [ ! -e "$path" ]; then
              echo "::error::site_manifest.txt lists missing path $path"
              status=1
              continue
            fi
            mkdir -p "_site/$(dirname "$path")"
            cp -r "$path" "_site/$(dirname "$path")/"
          done < site_manifest.txt
          exit $status
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
