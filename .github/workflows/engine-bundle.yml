name: Engine package

on:
  workflow_call:
    secrets:
      POV_TOKEN:
        description: Optional engine-repository token with Actions read access.
        required: false

permissions:
  contents: read

jobs:
  gate:
    name: Verified engine bundle
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - name: Resolve engine pin
        id: engine
        run: |
          pin="$(tr -d '[:space:]' < holosphere_wasm.sha)"
          if ! printf '%s' "$pin" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::holosphere_wasm.sha must contain one full engine commit"
            exit 1
          fi
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Download the verified engine bundle
        env:
          # The engine repository is public, so the run token is sufficient.
          # POV_TOKEN remains available for a future private-repo migration.
          GH_TOKEN: ${{ secrets.POV_TOKEN || github.token }}
          PIN: ${{ steps.engine.outputs.pin }}
        run: |
          deadline=$((SECONDS + 1800))
          while :; do
            run="$(gh api "repos/woundedlion/pov/actions/workflows/ci.yml/runs?head_sha=$PIN&branch=master&per_page=10" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0] // empty | [.id, .status, (.conclusion // "-"), .head_commit.timestamp] | @tsv')" || {
              echo "::error::Cannot query engine CI; check token access to woundedlion/pov Actions."
              exit 1
            }
            run_id='' run_status='' run_conclusion='' pin_date=''
            if [ -n "$run" ]; then
              read -r run_id run_status run_conclusion pin_date <<< "$run"
            fi
            if [ -n "$run_id" ]; then
              if [ "$run_status" = completed ]; then
                if [ "$run_conclusion" != success ]; then
                  echo "::error::POV CI for $PIN concluded $run_conclusion"
                  exit 1
                fi
                pin_age_days=$(( ($(date +%s) - $(date -d "$pin_date" +%s)) / 86400 ))
                if [ "$pin_age_days" -ge 60 ]; then
                  echo "::warning::Engine pin $PIN is $pin_age_days days old; retained bundles can expire."
                fi
                artifact="$(gh api "repos/woundedlion/pov/actions/runs/$run_id/artifacts" --jq ".artifacts | map(select(.name == \"holosphere-engine-$PIN\")) | .[0] // empty | [.id, .expired, .expires_at] | @tsv")"
                if [ -z "$artifact" ]; then
                  echo "::error::successful POV CI for $PIN published no verified engine bundle, or it expired. Rerun: gh run rerun $run_id --repo woundedlion/pov"
                  exit 1
                fi
                read -r artifact_id expired expires_at <<< "$artifact"
                if [ "$expired" = true ]; then
                  echo "::error::Engine bundle expired. Rerun: gh run rerun $run_id --repo woundedlion/pov"
                  exit 1
                fi
                remaining_days=$(( ($(date -d "$expires_at" +%s) - $(date +%s)) / 86400 ))
                if [ "$remaining_days" -le 14 ]; then
                  echo "::warning::Engine bundle expires in $remaining_days days. Renew it with: gh run rerun $run_id --repo woundedlion/pov"
                fi
                gh api "repos/woundedlion/pov/actions/artifacts/$artifact_id/zip" > /tmp/engine-bundle.zip
                python3 scripts/extract-engine-bundle.py /tmp/engine-bundle.zip engine-bundle
                break
              fi
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::no verified engine bundle became available for $PIN. Run POV CI at this commit, then retry this workflow."
              exit 1
            fi
            echo "Waiting for the engine bundle at $PIN."
            sleep 15
          done
      - name: Verify the engine package
        run: |
          (cd engine-bundle && sha256sum -c holosphere_engine.sha256)
          HOLOSPHERE_BUNDLE_PIN="$(cat holosphere_wasm.sha)" node scripts/install-engine-bundle.mjs engine-bundle
          git diff --exit-code
      - name: Share the verified package with tests and deployment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-engine-bundle
          path: engine-bundle/
          retention-days: 1
