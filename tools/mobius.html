<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Mobius Transformation Visualizer</title>
  <script src="../vendor-importmap.js"></script>
  <!-- The families tools.css styles for. Self-hosted for offline dev out of the
       gitignored /vendor/, so on the deploy this 404s and the onerror falls back
       to the canonical CDN copy. -->
  <link rel="stylesheet" href="../vendor/fonts/fonts.css"
    onerror="this.onerror=null;this.href='https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap'">
  <link rel="stylesheet" href="tools.css">
  <style>
    :root {
      --panel-height: 280px;
      --sidebar-width: 240px;
    }

    body {
      overflow: hidden;
      margin: 0;
    }

    #canvasContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: calc(100vw - var(--sidebar-width));
      height: calc(100vh - var(--panel-height));
      z-index: 10;
    }

    #presetSidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--sidebar-width);
      height: calc(100vh - var(--panel-height));
      background-color: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-left: 1px solid var(--slate-700);
      z-index: 15;
      padding: 1.5rem;
      overflow-y: auto;
    }

    /* Mobile-only presets dropdown; the sidebar list is shown on desktop. */
    #presetSelect {
      display: none;
      max-width: 55%;
    }

    #controls {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: var(--panel-height);
      z-index: 20;
      background-color: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.4);
      border-top: 1px solid var(--slate-700);
      display: flex;
      flex-direction: column;
      padding: 1rem;
    }

    .preset-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
      background-color: var(--slate-800);
      border: 1px solid var(--slate-700);
      border-radius: 0.5rem;
      color: #e2e8f0;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .preset-btn:hover {
      background-color: var(--slate-700);
      border-color: var(--indigo-400);
    }

    .preset-btn.active {
      background-color: rgba(59, 130, 246, 0.2);
      border-color: var(--blue-500);
      color: white;
    }

    .preset-desc {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 0.25rem;
      line-height: 1.2;
    }

    #parameters {
      display: flex;
      flex-direction: row;
      gap: 1.5rem;
      justify-content: center;
      align-items: flex-start;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      height: 100%;
      width: 100%;
    }

    .param-group {
      /* Visual base (background/border-radius/box-shadow) is inherited from
         tools.css; mobius packs param-groups into a horizontal scrolling panel,
         so it overrides padding/margin and adds the column layout. */
      padding: 0.75rem;
      margin-bottom: 0;
      width: 160px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* The export panel holds a code block rather than a square pad, so it opts
       out of .param-group's fixed width and centered column. */
    #export_group {
      width: 300px;
      align-items: stretch;
    }

    .complex-plane-control {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background-color: var(--slate-900);
      border-radius: 0.5rem;
      border: 1px solid var(--slate-800);
      cursor: grab;
      margin-top: 0.5rem;
      overflow: hidden;
      touch-action: none;
    }

    /* Visible keyboard-focus ring for the pad's per-axis slider handles. */
    .complex-plane-control:focus-within {
      outline: 2px solid var(--blue-500);
      outline-offset: 2px;
    }

    /* Off-screen but still focusable, so the pad's keyboard handles stay in the
       tab order and in the accessibility tree. */
    .complex-plane-axis {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      border: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .complex-plane-inner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .complex-plane-dot {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: var(--blue-500);
      border: 2px solid #ffffff;
      pointer-events: none;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
      z-index: 10;
    }

    .axis-h {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      background-color: var(--slate-600);
    }

    .axis-v {
      position: absolute;
      left: 50%;
      top: 0;
      height: 100%;
      width: 1px;
      background-color: var(--slate-600);
    }

    .complex-plane-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--indigo-400);
      text-align: center;
      margin-top: 0.5rem;
      white-space: nowrap;
      user-select: none;
      width: 100%;
    }

    #parameters::-webkit-scrollbar {
      height: 6px;
    }

    #parameters::-webkit-scrollbar-track {
      background: var(--slate-800);
      border-radius: 3px;
    }

    #parameters::-webkit-scrollbar-thumb {
      background: var(--slate-600);
      border-radius: 3px;
    }

    @media (max-width: 768px) {
      :root {
        --panel-height: 260px;
        --sidebar-width: 0px;
      }

      #canvasContainer {
        width: 100vw;
        height: 50vh;
      }

      #presetSidebar {
        display: none;
      }

      /* Presets stay reachable via the controls-header dropdown (the sidebar
         list above is hidden on mobile). */
      #presetSelect {
        display: block;
      }

      #controls {
        height: 50vh;
      }

      .param-group {
        width: 130px;
      }

      #export_group {
        width: 240px;
      }

      #parameters {
        justify-content: flex-start;
      }
    }
  </style>
  <!-- Linked last: utilities must outrank tools.css and the rules above. -->
  <link rel="stylesheet" href="tailwind.css">
</head>

<body>
  <div id="canvasContainer">
    <canvas id="threeCanvas" class="w-full h-full" role="img" aria-label="Real-time 3D preview of the Möbius transformation"></canvas>
  </div>

  <div id="presetSidebar">
    <h2 class="text-lg font-bold text-white mb-4 border-b border-slate-700 pb-2">Presets</h2>
    <div id="presetList"></div>
    <div class="mt-4 p-3 bg-slate-800 rounded border border-slate-700">
      <p class="text-xs text-indigo-300 italic">
        Drag any bottom control to stop animation.
      </p>
    </div>
  </div>

  <div id="controls">
    <div class="flex justify-between items-center mb-2 px-2 w-full max-w-7xl mx-auto">
      <div class="flex flex-col">
        <h1 class="text-lg font-bold text-white leading-tight">Mobius Visualizer</h1>
        <p class="text-xs text-indigo-300 font-mono">f(z) = (az + b) / (cz + d)</p>
        <p id="degenerateWarning" class="hidden text-xs text-amber-400 font-medium" role="status"></p>
      </div>
      <select id="presetSelect" aria-label="Preset"
        class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-medium rounded border border-slate-500 px-2 py-1 mx-2 truncate">
        <option value="">Presets…</option>
      </select>
      <button type="button" id="resetBtn"
        class="px-3 py-1 bg-slate-600 hover:bg-slate-500 text-white rounded text-xs font-medium transition-colors shadow-sm border border-slate-500">
        Stop / Reset
      </button>
    </div>

    <div id="parameters" class="w-full max-w-7xl mx-auto">
      <div id="A_param_group" class="param-group">
        <h3 class="text-xs uppercase tracking-wider font-semibold text-indigo-400">Param A</h3>
        <div id="A_control_container" class="w-full"></div>
      </div>
      <div id="B_param_group" class="param-group">
        <h3 class="text-xs uppercase tracking-wider font-semibold text-indigo-400">Param B</h3>
        <div id="B_control_container" class="w-full"></div>
      </div>
      <div id="C_param_group" class="param-group">
        <h3 class="text-xs uppercase tracking-wider font-semibold text-indigo-400">Param C</h3>
        <div id="C_control_container" class="w-full"></div>
      </div>
      <div id="D_param_group" class="param-group">
        <h3 class="text-xs uppercase tracking-wider font-semibold text-indigo-400">Param D</h3>
        <div id="D_control_container" class="w-full"></div>
      </div>
      <div id="export_group" class="param-group">
        <div class="flex justify-between items-center w-full mb-1">
          <h3 class="text-xs uppercase tracking-wider font-semibold text-indigo-400">Export Code</h3>
          <button type="button" id="copy_code_button"
            class="px-3 py-1 bg-blue-600 hover:bg-blue-700 rounded-md text-xs font-medium transition-all shadow-lg text-white">
            Copy Snippet
          </button>
        </div>
        <p class="text-xs text-gray-400 mb-1">
          C++ <span class="font-mono text-indigo-300">MobiusParams</span> initializer:
          <span id="copy_code_prompt" class="ml-2 text-gray-500 transition-colors duration-300" role="status"></span>
        </p>
        <pre class="bg-slate-900 p-2 rounded-lg border border-slate-700 overflow-x-auto cursor-pointer"
          id="code_pre_block"><code id="mobius_code_output" class="font-mono text-xs text-slate-300 whitespace-pre-wrap"></code></pre>
      </div>
    </div>
  </div>

  <script type="module" src="mobius_page.js"></script>
</body>

</html>
