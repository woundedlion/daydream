<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Solids Generator</title>
  <script src="../vendor-importmap.js"></script>
  <!-- The families tools.css styles for. Self-hosted for offline dev out of the
       gitignored /vendor/, so on the deploy this 404s and the onerror falls back
       to the canonical CDN copy. -->
  <link rel="stylesheet" href="../vendor/fonts/fonts.css"
    onerror="this.onerror=null;this.href='https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap'">
  <link rel="stylesheet" href="tools.css">
  <style>
    :root {
      --sidebar-width: 224px;
      /* Grows with viewport width but never collapses (or inverts) below the
         474px reference width; capped so it doesn't crowd the canvas. */
      --footer-height: clamp(96px, (100vw - 474px) * 0.22, 220px);
      --right-sidebar-width: 250px;
    }

    body {
      overflow: hidden;
      margin: 0;
      display: flex;
    }

    #sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      height: 100vh;
      background-color: rgba(15, 23, 42, 0.95);
      border-right: 1px solid var(--slate-700);
      display: flex;
      flex-direction: column;
      z-index: 20;
      overflow-y: auto;
      overflow-x: hidden;
    }

    #main {
      flex: 1;
      min-width: 0;
      position: relative;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #canvas-container {
      flex: 1;
      position: relative;
      background: linear-gradient(to bottom, var(--slate-900), var(--slate-800));
      min-height: 0;
      /* Allow shrinking */
      overflow: hidden;
    }

    #footer {
      width: 100%;
      height: var(--footer-height);
      background-color: transparent;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(max(64px, (100vw - 474px) * 0.08), 1fr));
      grid-auto-rows: calc((var(--footer-height) - 1.5rem) / 2);
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0.5rem;
      gap: 0.5rem;
      z-index: 10;
    }

    /* Scrollbar styling for footer */
    #footer::-webkit-scrollbar {
      height: 8px;
    }

    #footer::-webkit-scrollbar-track {
      background: var(--slate-900);
    }

    #footer::-webkit-scrollbar-thumb {
      background: var(--slate-700);
      border-radius: 4px;
    }

    #footer::-webkit-scrollbar-thumb:hover {
      background: var(--slate-600);
    }

    .thumb-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--slate-800);
      border: 2px solid var(--slate-700);
      border-radius: 0.75rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      padding: max(4px, (100vw - 474px) * 0.005);
      position: relative;
    }

    .thumb-btn:hover {
      border-color: var(--blue-500);
      background-color: var(--slate-700);
      transform: translateY(-2px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .thumb-btn.active {
      border-color: var(--blue-500);
      background-color: rgba(59, 130, 246, 0.15);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
    }

    .thumb-btn:focus-visible,
    .saved-restore:focus-visible,
    .move-op-btn:focus-visible {
      outline: 2px solid var(--blue-500);
      outline-offset: 2px;
    }

    .thumb-btn img {
      height: 60%;
      object-fit: contain;
      margin-bottom: max(2px, (100vw - 474px) * 0.004);
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
    }

    .thumb-btn .thumb-label {
      font-size: clamp(0.55rem, (100vw - 474px) * 0.008, 0.85rem);
      text-align: center;
      line-height: 1.1;
      color: #cbd5e1;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      overflow-wrap: anywhere;
    }

    /* Full name at readable size, shown over the tile on hover/focus; the
       resting label above is clamped to two lines and ellipsizes long names. */
    .thumb-name-full {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0.3rem;
      background: rgba(15, 23, 42, 0.92);
      border-radius: 0.6rem;
      font-size: clamp(0.65rem, (100vw - 474px) * 0.01, 0.9rem);
      line-height: 1.25;
      color: #e2e8f0;
      overflow-wrap: anywhere;
      overflow: hidden;
      pointer-events: none;
    }

    .thumb-btn:hover .thumb-name-full,
    .thumb-btn:focus-visible .thumb-name-full {
      display: flex;
    }

    /* .btn / .btn-primary / .btn-secondary now live in tools.css (shared).
       The add-op grid packs 14 buttons into the sidebar, so it overrides the
       shared padding with a tighter vertical profile. */
    #addOpGrid .btn {
      padding: 0.2rem 0.3rem;
    }

    /* Ops the validator proved would trap an engine invariant on the current
       mesh (see chainIsValid). */
    #addOpGrid .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .op-item {
      background-color: var(--slate-800);
      border: 1px solid var(--slate-700);
      padding: 0.25rem 0.4rem;
      border-radius: 0.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      box-sizing: border-box;
      position: relative;
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), border-color 0.2s, opacity 0.2s;
      user-select: none;
    }

    .op-item:hover {
      border-color: var(--indigo-400);
    }

    .op-item.dragging {
      opacity: 0.2;
      transform: scale(0.98);
      border-style: dashed;
      z-index: 10;
    }

    /* Marks a step the engine's morph path declines to sweep; empty and hidden
       while the step sweeps. */
    .op-unsweepable {
      margin-left: 0.25rem;
      cursor: help;
    }

    .drag-handle {
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1rem;
      height: 1.25rem;
      margin-right: 0.25rem;
      color: var(--slate-500);
      flex-shrink: 0;
      opacity: 0.5;
      transition: opacity 0.2s;
      /* The grip takes a touch drag, so the page must not scroll under it. */
      touch-action: none;
    }

    .op-item:hover .drag-handle {
      opacity: 1;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    /* While a slot the engine rejects is under the pointer. */
    .drag-handle.drop-blocked {
      cursor: not-allowed;
    }

    .drag-handle svg {
      width: 0.8rem;
      height: 0.8rem;
      fill: currentColor;
    }

    .move-op-btn {
      color: var(--slate-500);
      font-size: 0.7rem;
      line-height: 1;
      padding: 0.15rem;
    }

    .move-op-btn:disabled {
      opacity: 0.3;
    }

    #saveBtn {
      width: 3rem;
      height: 3rem;
      border-radius: 50%;
      background-color: rgba(15, 23, 42, 0.8);
      border: 2px solid var(--slate-700);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    #save-actions {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      z-index: 40;
    }

    /* Reserves the collapsed line the gate feedback usually occupies while
       still growing for a wrapped message. */
    #opGateMsg {
      min-height: 0.75rem;
      flex-shrink: 0;
    }

    #meshStats {
      background-color: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--slate-700);
      border-radius: 0.5rem;
      padding: 0.4rem 0.8rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: rgba(165, 180, 252, 0.8);
      text-transform: uppercase;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      pointer-events: none;
      white-space: nowrap;
    }

    #saveBtn:hover {
      border-color: var(--blue-500);
      transform: scale(1.1);
    }

    #saveBtn svg {
      width: 1.5rem;
      height: 1.5rem;
      stroke: #fbbf24;
      fill: none;
      stroke-width: 2;
    }

    #right-sidebar {
      width: var(--right-sidebar-width);
      flex-shrink: 0;
      height: 100vh;
      background-color: rgba(15, 23, 42, 0.95);
      border-left: 1px solid var(--slate-700);
      display: flex;
      flex-direction: column;
      z-index: 20;
      overflow-y: auto;
      padding: 1rem;
    }

    .saved-item {
      background-color: var(--slate-800);
      border: 1px solid var(--slate-700);
      border-radius: 0.5rem;
      padding: 0.5rem;
      margin-bottom: 0.75rem;
      transition: all 0.2s;
      position: relative;
    }

    .saved-restore {
      display: block;
      width: 100%;
      text-align: left;
    }

    .saved-item:hover {
      border-color: var(--blue-500);
      transform: translateY(-2px);
    }

    /* Saved solid whose generated funcName is shared with another card or with
       an engine-registry entry. */
    .saved-item.name-clash {
      border-color: #f59e0b;
    }

    .saved-item img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 0.25rem;
      margin-bottom: 0.5rem;
      background-color: #000;
    }

    .saved-item .title {
      font-size: 0.8rem;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 0.1rem;
    }

    .saved-item .details {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-bottom: 0.5rem;
    }

    .saved-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.4rem;
      margin-top: 0.4rem;
    }

    .action-btn {
      font-size: 0.65rem;
      padding: 0.2rem 0.4rem;
      border-radius: 0.2rem;
      background-color: var(--slate-700);
      color: #cbd5e1;
      border: 1px solid var(--slate-600);
      transition: all 0.2s;
      font-weight: 600;
    }

    .action-btn:hover {
      background-color: var(--blue-500);
      color: white;
      border-color: var(--blue-400);
    }

    .del-btn:hover {
      background-color: #ef4444;
      border-color: #f87171;
    }

    /* Small screens: the three side-by-side columns don't fit, so stack them
       (canvas, then controls, then saved solids) and let the page scroll. */
    @media (max-width: 640px) {
      body {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }

      #main {
        order: 1;
        height: 60vh;
      }

      #sidebar {
        order: 2;
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--slate-700);
      }

      #right-sidebar {
        order: 3;
        width: 100%;
        height: auto;
        border-left: none;
        border-top: 1px solid var(--slate-700);
      }
    }
    .group:focus-visible .op-tooltip {
      display: block;
    }
  </style>
  <!-- Linked last: utilities must outrank tools.css and the rules above. -->
  <link rel="stylesheet" href="tailwind.css">
</head>

<body>

  <div id="sidebar" class="p-4 space-y-6">
    <div>
      <h1 class="text-xl font-bold text-white mb-1">Solids Generator</h1>
      <p class="text-xs text-indigo-300">Conway Mesh Operators</p>
    </div>

    <!-- Operations Queue. The source solid renders as the pinned first card of
         the stack (not a draggable op row — it lives outside #opsList so the
         drag/drop index math stays 1:1 with state.ops). -->
    <div class="space-y-2 flex-1 overflow-hidden flex flex-col">
      <div class="flex-1 min-h-[140px] overflow-y-auto pr-2">
        <div class="flex items-center space-x-2 bg-slate-800 border border-slate-700 rounded px-1.5 py-1 mb-1">
          <img id="baseThumb" src="" alt=""
            class="w-8 h-8 object-contain bg-slate-900 rounded border border-slate-700 flex-shrink-0" />
          <div id="baseTitle" class="text-[0.65rem] font-black text-white uppercase tracking-wider line-clamp-2 min-w-0">
          </div>
        </div>
        <div id="opsList" class="relative space-y-1">
          <!-- Operations go here -->
        </div>
      </div>

      <div class="flex items-center justify-between">
        <h2 class="text-xs uppercase font-semibold text-slate-400">Add Operation</h2>
        <button type="button" id="clearOpsBtn"
          class="text-[0.65rem] text-red-400 hover:text-red-300 uppercase font-bold tracking-wider">Clear
          All</button>
      </div>
      <!-- Gate feedback: why the last op/reorder/base change was rejected. -->
      <div id="opGateMsg" class="text-[0.6rem] text-amber-400 leading-3"
        role="status" aria-atomic="true"></div>
      <!-- Add-operation buttons carry the op name in data-op; a single delegated
           click listener (wired in init) dispatches to addOp, so no handler is
           pinned to window. -->
      <div id="addOpGrid" class="grid grid-cols-3 gap-1 pt-1">
        <button type="button" data-op="kis" class="btn btn-secondary text-[0.65rem]">Kis</button>
        <button type="button" data-op="ambo" class="btn btn-secondary text-[0.65rem]">Ambo</button>
        <button type="button" data-op="gyro" class="btn btn-secondary text-[0.65rem]">Gyro</button>
        <button type="button" data-op="snub" class="btn btn-secondary text-[0.65rem]">Snub</button>
        <button type="button" data-op="dual" class="btn btn-secondary text-[0.65rem]">Dual</button>
        <button type="button" data-op="truncate" class="btn btn-secondary text-[0.65rem]">Truncate</button>
        <button type="button" data-op="chamfer" class="btn btn-secondary text-[0.65rem]">Chamfer</button>
        <button type="button" data-op="expand" class="btn btn-secondary text-[0.65rem]">Expand</button>
        <button type="button" data-op="hankin" class="btn btn-secondary text-[0.65rem]">Hankin</button>
        <button type="button" data-op="relax" class="btn btn-secondary text-[0.65rem]">Relax</button>
        <button type="button" data-op="meta" aria-describedby="metaDescription"
          class="btn btn-secondary text-[0.65rem] relative group">
          Meta
          <span
            id="metaDescription" class="op-tooltip absolute hidden group-hover:block bottom-full mb-1 left-1/2 -translate-x-1/2 bg-black text-white text-[0.5rem] p-1 rounded whitespace-nowrap z-50">
            Kis(Ambo(x))
          </span>
        </button>
        <button type="button" data-op="needle" aria-describedby="needleDescription"
          class="btn btn-secondary text-[0.65rem] relative group">
          Needle
          <span
            id="needleDescription" class="op-tooltip absolute hidden group-hover:block bottom-full mb-1 left-1/2 -translate-x-1/2 bg-black text-white text-[0.5rem] p-1 rounded whitespace-nowrap z-50">
            Kis(Dual(x))
          </span>
        </button>
        <button type="button" data-op="zip" aria-describedby="zipDescription"
          class="btn btn-secondary text-[0.65rem] relative group">
          Zip
          <span
            id="zipDescription" class="op-tooltip absolute hidden group-hover:block bottom-full mb-1 left-1/2 -translate-x-1/2 bg-black text-white text-[0.5rem] p-1 rounded whitespace-nowrap z-50">
            Dual(Kis(x))
          </span>
        </button>
        <button type="button" data-op="bevel" aria-describedby="bevelDescription"
          class="btn btn-secondary text-[0.65rem] relative group">
          Bevel
          <span
            id="bevelDescription" class="op-tooltip absolute hidden group-hover:block bottom-full mb-1 left-1/2 -translate-x-1/2 bg-black text-white text-[0.5rem] p-1 rounded whitespace-nowrap z-50">
            Truncate(Ambo(x), t)
          </span>
        </button>
      </div>
    </div>
  </div>

  <div id="main">
    <div id="canvas-container">
      <!-- Index Labels Overlay -->
      <div id="labels" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
      <div id="save-actions">
        <div class="flex flex-col items-end gap-1">
          <div id="meshStats" role="status" aria-atomic="true"></div>
          <div id="arenaStats"
            class="hidden md:block font-mono text-[0.6rem] text-slate-500 bg-slate-900/80 px-2 py-0.5 rounded border border-slate-700 whitespace-nowrap">
          </div>
        </div>
        <button id="saveBtn" type="button" title="Save to Collection" aria-label="Save solid to collection">
          <!-- Star Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <polygon
              points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
            </polygon>
          </svg>
        </button>
      </div>
      <canvas id="canvas" class="w-full h-full block" role="img" aria-label="Real-time 3D preview of the polyhedral solid"></canvas>
    </div>

    <div id="footer" role="group" aria-label="Base solids">
      <!-- Dynamic Thumbnails -->
    </div>
  </div>

  <div id="right-sidebar">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold text-white">Saved Solids</h2>
      <div class="flex gap-3">
        <button type="button" id="exportSavedBtn"
          class="text-xs text-indigo-300 hover:text-white uppercase font-bold tracking-wider">Export JSON</button>
        <button type="button" id="clearSavedBtn"
          class="text-xs text-red-400 hover:text-red-300 uppercase font-bold tracking-wider">Clear All</button>
      </div>
    </div>
    <div id="savedList" class="flex-1 overflow-y-auto" role="region" aria-label="Saved solids">
      <!-- Saved items go here -->
    </div>

    <!-- Visualization Options (kept out of the left sidebar so the op stack
         retains its vertical space on short viewports) -->
    <div class="space-y-2 border-t border-slate-700 pt-4 mt-4 flex-shrink-0">
      <h2 class="text-xs uppercase font-semibold text-slate-400">Visualization</h2>

      <div class="flex items-center justify-between">
        <label for="toggleRotate" class="text-sm">Auto Rotate</label>
        <button id="toggleRotate" type="button" class="toggle-switch" role="switch" aria-checked="false"><div class="toggle-knob"></div></button>
      </div>

      <div class="flex items-center justify-between">
        <label for="toggleGeo" class="text-sm">Geodesic Edges</label>
        <button id="toggleGeo" type="button" class="toggle-switch is-on" role="switch" aria-checked="true"><div class="toggle-knob"></div></button>
      </div>

      <div class="flex items-center justify-between">
        <label for="toggleFaces" class="text-sm">Show Faces</label>
        <button id="toggleFaces" type="button" class="toggle-switch is-on" role="switch" aria-checked="true"><div class="toggle-knob"></div></button>
      </div>

      <div class="flex items-center justify-between">
        <label for="toggleColorize" class="text-sm">Colorize Faces</label>
        <button id="toggleColorize" type="button" class="toggle-switch" role="switch" aria-checked="false"><div class="toggle-knob"></div></button>
      </div>

      <div class="flex items-center justify-between">
        <label for="toggleVerts" class="text-sm">Show Vertices</label>
        <button id="toggleVerts" type="button" class="toggle-switch" role="switch" aria-checked="false"><div class="toggle-knob"></div></button>
      </div>

      <div class="flex items-center justify-between">
        <label for="toggleNormals" class="text-sm">Show Normals</label>
        <button id="toggleNormals" type="button" class="toggle-switch" role="switch" aria-checked="false"><div class="toggle-knob"></div></button>
      </div>

      <div class="flex items-center justify-between">
        <label for="toggleIndices" class="text-sm">Show Indices</label>
        <button id="toggleIndices" type="button" class="toggle-switch" role="switch" aria-checked="false"><div class="toggle-knob"></div></button>
      </div>
    </div>
  </div>

  <script type="module" src="solids_page.js"></script>
</body>

</html>
